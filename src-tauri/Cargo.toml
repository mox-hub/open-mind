[package]
name = "open-mind"
version = "0.5.2"
description = "OpenMind - 本地优先的开源思维导图桌面工具"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "open_mind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
